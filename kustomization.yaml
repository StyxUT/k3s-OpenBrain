---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openbrain-configmap.yaml
  - openbrain-db-init-job.yaml
  - openbrain-deployment.yaml
  - openbrain-svc.yaml
  - openbrain-postgres-pv.yaml
  - postgres-deployment.yaml
  - postgres-svc.yaml
  - network-policies.yaml
configMapGenerator:
  - name: openbrain-runtime-source
    files:
      - index.ts=app/index.ts
      - embedding.ts=app/embedding.ts
secretGenerator:
  - name: openbrain-secret
    files:
      - MCP_ACCESS_KEY=./secrets/mcp_access_key.txt
generatorOptions:
  disableNameSuffixHash: true
