apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbrain-db-access
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [openbrain, openbrain-db-init]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbrain-model-access
spec:
  podSelector:
    matchLabels:
      app: openbrain
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.0.13/32
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 11435}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-private
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openbrain
        - podSelector:
            matchLabels:
              app: openbrain-db-init
        - podSelector:
            matchLabels:
              app: pconxt
      ports:
        - {protocol: TCP, port: 5432}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 9187}
