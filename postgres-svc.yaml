apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
    monitoring.styxut.net/scrape: "true"
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP
